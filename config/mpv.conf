# CRT-mpv player settings. Isolated from any mpv config you already have
# (the launchers pass --config-dir pointing at this folder).
vo=gpu-next
hwdec=no
scale=ewa_lanczossharp
cscale=spline36
dscale=mitchell
keep-open=yes
# started without a video, open anyway: scripts/open.lua puts the TV on with no signal
idle=once
force-window=yes
osd-level=1
osd-font-size=32
background-color="#000000"

# the CRT shader (scanlines, curvature, phosphor mask, vignette)
glsl-shaders="~~/shaders/crt.glsl"

# on-screen controls come from scripts/modernz.lua instead of mpv's built-in bar
osc=no
osd-bar=no
watch-later-options-remove=sub-pos

# YouTube links (the bar's YouTube button, scripts/youtube.lua) are fetched by yt-dlp, which the installer puts in
# this folder. 1080p at most: a CRT shows far fewer lines anyway. yt-dlp needs a JavaScript runtime for YouTube;
# it uses Deno when installed, and this lets it use Node.js too. On a computer with neither, the installer puts
# Deno in this folder and scripts/youtube.lua points yt-dlp at it.
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
ytdl-raw-options-append=js-runtimes=node
