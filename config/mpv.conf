# CRT-mpv player settings. Isolated from any mpv config you already have
# (the launchers pass --config-dir pointing at this folder).
vo=gpu-next
hwdec=no
scale=ewa_lanczossharp
cscale=spline36
dscale=mitchell
keep-open=yes
osd-level=1
osd-font-size=32
background-color="#000000"

# the CRT shader (scanlines, curvature, phosphor mask, vignette)
glsl-shaders="~~/shaders/crt.glsl"

# on-screen controls come from scripts/modernz.lua instead of mpv's built-in bar
osc=no
osd-bar=no
watch-later-options-remove=sub-pos
