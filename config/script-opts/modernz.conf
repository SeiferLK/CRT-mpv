# CRT-mpv: VLC-style hover controls (ModernZ). Full option list: https://github.com/Samillion/ModernZ
layout=default
window_top_bar=no
idlescreen=no
showwindowed=yes
showfullscreen=yes
showonpause=yes
hidetimeout=1500
download_button=no
volume_control=yes
subtitles_button=yes
audio_tracks_button=yes
playlist_button=yes
fullscreen_button=yes
speed_button=yes
# the shuffle button is redrawn as an eject button by script-modules/crt_bar.lua: it opens a video
shuffle_button=yes
screenshot_button=yes
ontop_button=yes
info_button=yes
# the "i" button (patched by the installer into a menu icon) opens the CRT remote
info_mbtn_left_command=script-message crt-remote-toggle
# the screenshot button (redrawn as a YouTube button by script-modules/crt_bar.lua) opens the YouTube link window
screenshot_mbtn_left_command=script-message crt-youtube
# the pin button (redrawn as a moon by script-modules/crt_bar.lua) switches night mode
ontop_mbtn_left_command=script-message crt-do night
# keep subtitles fixed inside the TV screen when the bar shows or hides (crt.lua positions them)
sub_margins=no
dynamic_margins=no
