# CRT-mpv: VLC-style hover controls (ModernZ). Full option list: https://github.com/Samillion/ModernZ
layout=default
window_top_bar=no
idlescreen=no
showwindowed=yes
showfullscreen=yes
showonpause=yes
hidetimeout=1500
download_button=no
volume_control=yes
subtitles_button=yes
audio_tracks_button=yes
playlist_button=yes
fullscreen_button=yes
speed_button=no
# the file loop button is redrawn as the About button by script-modules/crt_bar.lua
loop_button=yes
file_loop_mbtn_left_command=script-message crt-about
file_loop_mbtn_right_command=ignore
# the shuffle button is redrawn as a library (folder) button by script-modules/crt_bar.lua: it opens a video
shuffle_button=yes
screenshot_button=yes
ontop_button=yes
info_button=yes
# the "i" button (patched by the installer into a menu icon) opens the CRT remote
info_mbtn_left_command=script-message crt-remote-toggle
# the screenshot button (redrawn as a YouTube button by script-modules/crt_bar.lua) opens the YouTube link window
screenshot_mbtn_left_command=script-message crt-youtube
# the pin button (redrawn as a moon by script-modules/crt_bar.lua) switches night mode
ontop_mbtn_left_command=script-message crt-do night
# keep subtitles fixed inside the TV screen when the bar shows or hides (crt.lua positions them)
sub_margins=no
dynamic_margins=no

# All player menus share the CRT library's panel style.
playlist_mbtn_left_command=script-message crt-menu playlist
playlist_mbtn_right_command=script-message crt-menu controls
playlist_prev_mbtn_right_command=script-message crt-menu playlist
playlist_next_mbtn_right_command=script-message crt-menu playlist
audio_track_mbtn_left_command=script-message crt-menu audio
sub_track_mbtn_left_command=script-message crt-menu subtitles
chapter_title_mbtn_left_command=script-message crt-menu chapters
chapter_prev_mbtn_right_command=script-message crt-menu chapters
chapter_next_mbtn_right_command=script-message crt-menu chapters
vol_ctrl_mbtn_right_command=script-message crt-menu device
speed_mbtn_left_command=script-message crt-menu speed
title_mbtn_right_command=script-message crt-open-recent
